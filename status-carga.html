<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status da carga</title>

    <link rel="icon" href="img/ChatGPT_Image_Mar_23__2026__07_48_58_PM-removebg-preview.png">
    <link rel="stylesheet" href="css/status-carga.css">
</head>

<body>

    <header>
        <div id="div_logo">
            <img 
                id="logo_img" 
                src="img/ChatGPT_Image_Mar_23__2026__07_48_58_PM-removebg-preview.png" 
                alt="Logo Save Yogurt"
            >
            <p id="logo">Save Yogurt</p>
        </div>

        <div id="div_links">
            <a href="dashboard.html">
                <p>Dashboard</p>
            </a>

            <a href="cadastro-do-lote.html">
                <p>Cadastro de itens</p>
            </a>
        </div>

        <div id="div_botoes">
            <a href="index.html">
                <button class="botoes">Sair</button>
            </a>
        </div>
    </header>

    <main>
        <div id="bloco_titulo">
            <div id="titulo">
                <h1>Atualizar Localização e Status da Carga</h1>
            </div>
        </div>

        <div id="bloco_maior">

            <h3 class="titulo_secao">Dados da carga para atualização</h3>

            <div class="grupo_input">
                <label>Código da Carga</label>
                <input type="text" id="id_numero_lote" placeholder="Ex: CARGA-XXXX">
            </div>

            <h3 class="titulo_secao">Informações de localização e status atual</h3>

            <div class="inputs_lado_a_lado">
                <div class="grupo_input">
                    <label>Última localização registrada</label>
                    <input type="text" id="id_ultima_localizacao" placeholder="CD São Paulo - Plataforma A">

                    <label for="status">Novo status da carga</label>
                    <select name="status_carga" id="status">
                        <option value="em_transito">Em trânsito</option>
                        <option value="entregue">Entregue</option>
                    </select>
                </div>

                <div class="grupo_input">
                    <label>Nova localização / Endereço</label>
                    <input type="text" id="id_nova_localizacao" placeholder="Ex: Rodovia SP-101, Km 50">
                </div>
            </div>

            <button class="botao_salvar" onclick="salvar_atualizacao()">Salvar atualização</button>
            <button class="botao_cancelar" onclick="cancelar()">Cancelar</button>

        </div>
    </main>

    <footer>
        <div class="footer_brand">
            <h2>Save Iogurte</h2>
            <p>© 2024 Save Iogurte.</p>
        </div>

        <div class="footer_col">
            <span>EMPRESA</span>
            <a href="#">Sobre Nós</a>
            <a href="#">Produtos</a>
            <a href="#">Integrantes</a>
        </div>

        <div class="footer_col">
            <span>SUPORTE</span>
            <a href="#">Contatos</a>
            <a href="#">Endereço</a>
            <a href="#">FAQ</a>
        </div>

        <div class="footer_col">
            <span>SOCIAL</span>
            <div class="footer_icons">
                <img src="img/compartilhar.png" alt="Compartilhar">
                <img src="img/terra-icon.png" alt="Site">
                <img src="img/mail.png" alt="Email">
            </div>
        </div>
    </footer>

</body>

</html>
